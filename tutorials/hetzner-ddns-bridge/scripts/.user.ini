; Per-directory PHP settings, picked up by PHP-FPM and CGI/FastCGI SAPIs
; (the usual setup on shared hosting and behind nginx). mod_php ignores this
; file; use php_flag/php_value in .htaccess there if your host allows it.
;
; .htaccess already refuses every method except GET/HEAD, so request bodies
; normally never reach PHP. These settings are the second line of defence for
; servers without .htaccess support (nginx) and shrink the attack surface of
; PHP2Shell (CVE-2026-109618, CVE-2026-109619) and CVE-2026-115560. They are a
; mitigation, not a fix: run a patched PHP (>= 8.2.35, 8.3.36, 8.4.27, 8.5.12).

; Never show errors or stack traces to HTTP clients; they reveal server paths.
display_errors = Off

; Session upload progress is on by default and runs even though this script
; never starts a session. It is the component abused by CVE-2026-109619 and
; CVE-2026-115560 and is not needed here.
session.upload_progress.enabled = 0

; The endpoint is GET-only: keep POST bodies and uploads tiny.
post_max_size = 16K
upload_max_filesize = 16K
max_input_vars = 32
